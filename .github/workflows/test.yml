name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-jiosaavn:
    name: JioSaavn (Node.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test

  test-ytmusic:
    name: YouTube Music (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: YouTube Music
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'YouTube Music/requirements.txt'
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -v
