<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenMusic API</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #09090e;
      --bg-panel: rgba(20, 20, 28, 0.6);
      --glass-border: rgba(255, 255, 255, 0.08);
      --accent: #8b5cf6;
      --accent-hover: #a78bfa;
      --accent-gradient: linear-gradient(135deg, #8b5cf6, #ec4899);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --radius: 16px;
      --font: 'Outfit', sans-serif;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font);
      background: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 15% 50%, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 85% 30%, rgba(236, 72, 153, 0.15) 0%, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      overflow-x: hidden;
    }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

    /* Glassmorphism Utilities */
    .glass {
      background: var(--bg-panel);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      height: 100vh;
      position: fixed;
      left: 0;
      top: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 32px;
      border-right: 1px solid var(--glass-border);
      background: rgba(9, 9, 14, 0.8);
      backdrop-filter: blur(20px);
      z-index: 100;
    }

    .brand {
      font-size: 24px;
      font-weight: 700;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav-menu { display: flex; flex-direction: column; gap: 8px; }
    
    .nav-item {
      padding: 12px 16px;
      border-radius: 12px;
      color: var(--text-muted);
      cursor: pointer;
      font-weight: 500;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav-item:hover { color: var(--text-main); background: rgba(255,255,255,0.05); }
    .nav-item.active { color: #fff; background: var(--accent-gradient); box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3); }

    .source-selector {
      margin-top: auto;
      padding: 16px;
    }
    
    .source-label { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
    
    .source-btn {
      width: 100%;
      padding: 12px;
      margin-bottom: 8px;
      border-radius: 10px;
      border: 1px solid var(--glass-border);
      background: rgba(0,0,0,0.2);
      color: var(--text-muted);
      cursor: pointer;
      transition: var(--transition);
      font-family: var(--font);
      font-weight: 500;
    }
    .source-btn.active {
      border-color: var(--accent);
      color: #fff;
      background: rgba(139, 92, 246, 0.1);
    }

    /* Main Content */
    .main-content {
      margin-left: 260px;
      padding: 32px 48px 120px 48px;
      width: calc(100% - 260px);
      min-height: 100vh;
    }

    .top-bar {
      margin-bottom: 32px;
      position: relative;
    }

    .search-container {
      position: relative;
      max-width: 600px;
    }

    .search-input {
      width: 100%;
      padding: 16px 24px;
      padding-right: 60px;
      font-size: 16px;
      color: #fff;
      background: var(--bg-panel);
      border: 1px solid var(--glass-border);
      border-radius: 100px;
      outline: none;
      transition: var(--transition);
      font-family: var(--font);
      backdrop-filter: blur(10px);
    }

    .search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.1); }
    
    .search-btn {
      position: absolute;
      right: 8px;
      top: 8px;
      bottom: 8px;
      padding: 0 20px;
      border-radius: 100px;
      border: none;
      background: var(--accent-gradient);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }
    .search-btn:hover { transform: scale(1.05); }

    .suggestions {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      right: 0;
      z-index: 50;
      display: none;
      padding: 8px;
    }
    .suggestions.active { display: block; }
    .suggestion-item {
      padding: 12px 16px;
      border-radius: 8px;
      cursor: pointer;
      color: var(--text-muted);
      transition: var(--transition);
    }
    .suggestion-item:hover { background: rgba(255,255,255,0.05); color: #fff; }

    /* Views */
    .view-panel { display: none; animation: fadeIn 0.4s ease; }
    .view-panel.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .section-title { font-size: 24px; font-weight: 600; margin-bottom: 24px; }

    /* Grid Layouts */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 24px;
    }

    .card {
      padding: 16px;
      cursor: pointer;
      transition: var(--transition);
    }

    .card:hover {
      transform: translateY(-8px);
      border-color: rgba(255,255,255,0.2);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .card-img-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .card:hover .card-img { transform: scale(1.08); }

    .card-play-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: var(--transition);
    }

    .card:hover .card-play-overlay { opacity: 1; }

    .play-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--accent-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      transform: translateY(10px);
      transition: var(--transition);
    }
    .card:hover .play-icon { transform: translateY(0); }

    .card-title { font-weight: 600; font-size: 15px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-subtitle { color: var(--text-muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Input Forms for Album/Playlist */
    .id-form { display: flex; gap: 12px; max-width: 500px; margin-bottom: 32px; }
    .id-input {
      flex: 1;
      padding: 12px 20px;
      background: rgba(0,0,0,0.2);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      color: #fff;
      font-family: var(--font);
      outline: none;
      transition: var(--transition);
    }
    .id-input:focus { border-color: var(--accent); }
    .id-btn {
      padding: 0 24px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      color: #fff;
      cursor: pointer;
      font-family: var(--font);
      transition: var(--transition);
    }
    .id-btn:hover { background: rgba(255,255,255,0.1); }

    /* Detail View (Album/Playlist) */
    .detail-header { display: flex; gap: 32px; align-items: flex-end; margin-bottom: 40px; }
    .detail-cover { width: 240px; height: 240px; border-radius: 16px; object-fit: cover; box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
    .detail-info h1 { font-size: 48px; font-weight: 700; margin-bottom: 12px; line-height: 1.1; }
    .detail-meta { color: var(--text-muted); font-size: 15px; display: flex; gap: 16px; align-items: center; }
    
    .tracklist { display: flex; flex-direction: column; gap: 8px; }
    .track-row {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      border-radius: 12px;
      transition: var(--transition);
      cursor: pointer;
    }
    .track-row:hover { background: rgba(255,255,255,0.05); }
    .track-num { width: 40px; color: var(--text-muted); font-size: 14px; }
    .track-info { flex: 1; }
    .track-title { font-weight: 500; font-size: 15px; }
    .track-artist { color: var(--text-muted); font-size: 13px; margin-top: 4px; }
    .track-dur { color: var(--text-muted); font-size: 14px; }

    /* Player Bar */
    .player {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 90px;
      background: rgba(10, 10, 15, 0.85);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      padding: 0 32px;
      z-index: 200;
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .player.active { transform: translateY(0); }

    .np-info { display: flex; align-items: center; gap: 16px; width: 300px; }
    .np-img { width: 56px; height: 56px; border-radius: 8px; object-fit: cover; }
    .np-text { display: flex; flex-direction: column; gap: 4px; overflow: hidden; }
    .np-title { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .np-artist { color: var(--text-muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .audio-controls { flex: 1; display: flex; justify-content: center; }
    audio { width: 100%; max-width: 600px; height: 40px; outline: none; }

    .player-actions { width: 300px; display: flex; justify-content: flex-end; }
    .close-btn { background: none; border: none; color: var(--text-muted); font-size: 24px; cursor: pointer; transition: var(--transition); }
    .close-btn:hover { color: #fff; transform: scale(1.1); }

    /* Utils */
    .loading { text-align: center; padding: 60px; color: var(--text-muted); display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { padding: 16px 24px; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 12px; color: #fca5a5; margin-bottom: 24px; }
    
    .badge { padding: 4px 10px; background: rgba(255,255,255,0.1); border-radius: 100px; font-size: 12px; }

    @media (max-width: 768px) {
      .sidebar { width: 80px; padding: 24px 12px; }
      .brand span { display: none; }
      .nav-item span { display: none; }
      .main-content { margin-left: 80px; width: calc(100% - 80px); padding: 24px; }
      .detail-header { flex-direction: column; align-items: center; text-align: center; }
      .np-info { width: auto; max-width: 200px; }
      .player-actions { display: none; }
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="url(#grad1)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <defs><linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#8b5cf6" /><stop offset="100%" stop-color="#ec4899" /></linearGradient></defs>
        <path d="M9 18V5l12-2v13"></path>
        <circle cx="6" cy="18" r="3"></circle>
        <circle cx="18" cy="16" r="3"></circle>
      </svg>
      <span>OpenMusic</span>
    </div>

    <div class="nav-menu">
      <div class="nav-item active" data-target="search">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <span>Discover</span>
      </div>
      <div class="nav-item" data-target="album">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
        <span>Albums</span>
      </div>
      <div class="nav-item" data-target="playlist">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
        <span>Playlists</span>
      </div>
      <div class="nav-item" data-target="charts">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
        <span>Charts</span>
      </div>
    </div>

    <div class="nav-menu" style="margin-top: 8px;">
      <div style="font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); padding: 8px 16px 4px 16px;">Developer Tools</div>
      <a href="Admin-Test.html" class="nav-item" style="text-decoration: none;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>
        <span>Admin Test</span>
      </a>
      <a href="tester.html" class="nav-item" style="text-decoration: none;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
        <span>API Tester</span>
      </a>
    </div>

    <div class="source-selector glass">
      <div class="source-label">Music Source</div>
      <button class="source-btn active" data-source="jiosaavn">JioSaavn</button>
      <button class="source-btn" data-source="youtube">YouTube Music</button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    
    <!-- Search View -->
    <div id="view-search" class="view-panel active">
      <div class="top-bar">
        <div class="search-container">
          <input type="text" id="searchInput" class="search-input" placeholder="Search for songs, artists..." autocomplete="off">
          <button id="searchBtn" class="search-btn">Search</button>
          <div id="suggestions" class="suggestions glass"></div>
        </div>
      </div>
      <h2 class="section-title">Results</h2>
      <div id="searchResults" class="grid">
        <div class="loading" style="display:none; grid-column: 1/-1;">
          <div class="spinner"></div>
          <div>Exploring the universe of music...</div>
        </div>
      </div>
    </div>

    <!-- Album View -->
    <div id="view-album" class="view-panel">
      <h2 class="section-title">Lookup Album</h2>
      <div class="id-form">
        <input type="text" id="albumId" class="id-input" placeholder="Enter Album ID">
        <button id="loadAlbumBtn" class="id-btn">Load</button>
      </div>
      <div id="albumContent"></div>
    </div>

    <!-- Playlist View -->
    <div id="view-playlist" class="view-panel">
      <h2 class="section-title">Lookup Playlist</h2>
      <div class="id-form">
        <input type="text" id="playlistId" class="id-input" placeholder="Enter Playlist ID">
        <button id="loadPlaylistBtn" class="id-btn">Load</button>
      </div>
      <div id="playlistContent"></div>
    </div>

    <!-- Charts View -->
    <div id="view-charts" class="view-panel">
      <h2 class="section-title">Top Charts</h2>
      <div id="chartsContent" class="grid"></div>
    </div>

  </main>

  <!-- Player -->
  <div class="player" id="player">
    <div class="np-info">
      <img src="" alt="cover" class="np-img" id="npImg" style="display:none;">
      <div class="np-text">
        <div class="np-title" id="npTitle">Select a track to play</div>
        <div class="np-artist" id="npArtist"></div>
      </div>
    </div>
    <div class="audio-controls">
      <audio id="audio" controls preload="auto"></audio>
    </div>
    <div class="player-actions">
      <button class="close-btn" id="closePlayer">&times;</button>
    </div>
  </div>

  <script>
    const API = '';
    let state = { source: 'jiosaavn', timer: null };

    const $ = s => document.querySelector(s);
    const $$ = s => document.querySelectorAll(s);

    // Navigation
    $$('.nav-item').forEach(el => {
      el.addEventListener('click', () => {
        $$('.nav-item').forEach(n => n.classList.remove('active'));
        el.classList.add('active');
        
        $$('.view-panel').forEach(v => v.classList.remove('active'));
        $(`#view-${el.dataset.target}`).classList.add('active');

        if (el.dataset.target === 'charts') fetchCharts();
      });
    });

    // Source Selection
    $$('.source-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        $$('.source-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.source = btn.dataset.source;
        
        // Reset views
        $('#searchResults').innerHTML = '';
        $('#albumContent').innerHTML = '';
        $('#playlistContent').innerHTML = '';
        if ($('#view-charts').classList.contains('active')) fetchCharts();
      });
    });

    // API Helper
    async function fetchAPI(endpoint) {
      const res = await fetch(`${API}/${state.source}${endpoint}`);
      if (!res.ok) {
        if (res.status === 501) throw new Error(`${state.source === 'youtube' ? 'YouTube Music' : 'Source'} does not support this feature.`);
        const err = await res.json().catch(() => ({}));
        throw new Error(err.message || `Error ${res.status}`);
      }
      return res.json();
    }

    // HTML Escaper
    const esc = str => (str || '').replace(/[&<>'"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;' }[c]));

    // Format Duration
    const fmtDur = s => s ? `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}` : '--:--';

    // Search
    $('#searchBtn').addEventListener('click', doSearch);
    $('#searchInput').addEventListener('keydown', e => e.key === 'Enter' && doSearch());
    $('#searchInput').addEventListener('input', e => {
      clearTimeout(state.timer);
      const q = e.target.value.trim();
      if (q.length < 2) return $('#suggestions').classList.remove('active');
      state.timer = setTimeout(async () => {
        try {
          const data = await fetchAPI(`/suggestions?q=${encodeURIComponent(q)}`);
          if (data.suggestions?.length) {
            $('#suggestions').innerHTML = data.suggestions.map(s => 
              `<div class="suggestion-item">${esc(s)}</div>`
            ).join('');
            $('#suggestions').classList.add('active');
            $$('.suggestion-item').forEach(item => {
              item.addEventListener('click', () => {
                $('#searchInput').value = item.textContent;
                $('#suggestions').classList.remove('active');
                doSearch();
              });
            });
          }
        } catch(e) {}
      }, 300);
    });

    document.addEventListener('click', e => {
      if (!e.target.closest('.search-container')) $('#suggestions').classList.remove('active');
    });

    async function doSearch() {
      const q = $('#searchInput').value.trim();
      if (!q) return;
      $('#suggestions').classList.remove('active');
      $('#searchResults').innerHTML = `<div class="loading" style="grid-column:1/-1"><div class="spinner"></div><div>Searching ${state.source}...</div></div>`;
      
      try {
        const data = await fetchAPI(`/search?q=${encodeURIComponent(q)}`);
        if (!data.results?.length) throw new Error("No results found.");
        
        $('#searchResults').innerHTML = data.results.map(t => `
          <div class="card glass" onclick="playTrack('${esc(t.id)}', '${esc(t.title)}', '${esc(t.artist)}', '${esc(t.thumbnail)}')">
            <div class="card-img-wrapper">
              <img src="${t.thumbnail || ''}" class="card-img" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 200 200%22><rect fill=%22%23222%22 width=%22200%22 height=%22200%22/></svg>'">
              <div class="card-play-overlay"><div class="play-icon">&#9654;</div></div>
            </div>
            <div class="card-title">${esc(t.title)}</div>
            <div class="card-subtitle">${esc(t.artist)} &bull; ${fmtDur(t.duration_seconds)}</div>
          </div>
        `).join('');
      } catch (err) {
        $('#searchResults').innerHTML = `<div class="error" style="grid-column:1/-1">${esc(err.message)}</div>`;
      }
    }

    // Playback
    async function playTrack(id, title, artist, thumb) {
      $('#npTitle').textContent = title;
      $('#npArtist').textContent = artist;
      $('#npImg').src = thumb;
      $('#npImg').style.display = 'block';
      $('#player').classList.add('active');
      
      const audio = $('#audio');
      audio.pause();
      // append title and artist for YouTube proxy metadata matching
      const queryParams = new URLSearchParams({ title, artist }).toString();
      audio.src = `${API}/${state.source}/track/${encodeURIComponent(id)}/play?${queryParams}`;
      audio.play().catch(() => {});
    }

    $('#closePlayer').addEventListener('click', () => {
      $('#audio').pause();
      $('#player').classList.remove('active');
    });

    // Album & Playlist & Charts
    const renderDetail = (data, container) => {
      const html = `
        <div class="detail-header">
          <img src="${data.thumbnail || ''}" class="detail-cover" onerror="this.style.display='none'">
          <div class="detail-info">
            <h1>${esc(data.title)}</h1>
            <div class="detail-meta">
              ${data.artist ? `<span>${esc(data.artist)}</span>` : ''}
              ${data.owner ? `<span>By ${esc(data.owner)}</span>` : ''}
              ${data.year ? `<span class="badge">${data.year}</span>` : ''}
              <span class="badge">${data.song_count || data.tracks?.length || 0} tracks</span>
            </div>
          </div>
        </div>
        <div class="tracklist glass" style="padding: 16px;">
          ${(data.tracks || []).map((t, i) => `
            <div class="track-row" onclick="playTrack('${esc(t.id)}', '${esc(t.title)}', '${esc(t.artist)}', '${esc(t.thumbnail || data.thumbnail)}')">
              <div class="track-num">${i + 1}</div>
              <div class="track-info">
                <div class="track-title">${esc(t.title)}</div>
                <div class="track-artist">${esc(t.artist)}</div>
              </div>
              <div class="track-dur">${fmtDur(t.duration_seconds)}</div>
            </div>
          `).join('')}
        </div>
      `;
      $(container).innerHTML = html;
    };

    $('#loadAlbumBtn').addEventListener('click', async () => {
      const id = $('#albumId').value.trim();
      if (!id) return;
      $('#albumContent').innerHTML = '<div class="loading"><div class="spinner"></div></div>';
      try {
        const data = await fetchAPI(`/album/${encodeURIComponent(id)}`);
        renderDetail(data, '#albumContent');
      } catch (err) {
        $('#albumContent').innerHTML = `<div class="error">${esc(err.message)}</div>`;
      }
    });

    $('#loadPlaylistBtn').addEventListener('click', async () => {
      const id = $('#playlistId').value.trim();
      if (!id) return;
      $('#playlistContent').innerHTML = '<div class="loading"><div class="spinner"></div></div>';
      try {
        const data = await fetchAPI(`/playlist/${encodeURIComponent(id)}`);
        renderDetail(data, '#playlistContent');
      } catch (err) {
        $('#playlistContent').innerHTML = `<div class="error">${esc(err.message)}</div>`;
      }
    });

    async function fetchCharts() {
      $('#chartsContent').innerHTML = '<div class="loading" style="grid-column:1/-1"><div class="spinner"></div></div>';
      try {
        const data = await fetchAPI(`/charts`);
        if (!data.charts?.length) throw new Error("No charts available.");
        
        $('#chartsContent').innerHTML = data.charts.map(c => `
          <div class="card glass" onclick="
            $$('.nav-item').forEach(n => n.classList.remove('active'));
            $$('.nav-item')[2].classList.add('active');
            $$('.view-panel').forEach(v => v.classList.remove('active'));
            $('#view-playlist').classList.add('active');
            $('#playlistId').value = '${esc(c.id)}';
            $('#loadPlaylistBtn').click();
          ">
            <div class="card-img-wrapper">
              <img src="${c.thumbnail || ''}" class="card-img" onerror="this.style.display='none'">
              <div class="card-play-overlay"><div class="play-icon">&#8594;</div></div>
            </div>
            <div class="card-title">${esc(c.title)}</div>
            <div class="card-subtitle">${esc(c.description || '')}</div>
          </div>
        `).join('');
      } catch (err) {
        $('#chartsContent').innerHTML = `<div class="error" style="grid-column:1/-1">${esc(err.message)}</div>`;
      }
    }
  </script>
</body>
</html>
