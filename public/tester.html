<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenMusic API Tester</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #09090e;
      --bg-panel: rgba(20, 20, 28, 0.6);
      --glass-border: rgba(255, 255, 255, 0.08);
      --accent: #8b5cf6;
      --accent-gradient: linear-gradient(135deg, #8b5cf6, #ec4899);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --radius: 12px;
      --font: 'Outfit', sans-serif;
      --mono: 'Fira Code', monospace;
      --transition: all 0.2s ease;
      --success: #10b981;
      --error: #ef4444;
      --warning: #f59e0b;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font); background: var(--bg-dark);
      background-image: radial-gradient(circle at 15% 50%, rgba(139, 92, 246, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 85% 30%, rgba(236, 72, 153, 0.1) 0%, transparent 50%);
      background-attachment: fixed; color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column;
    }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

    .glass { background: var(--bg-panel); backdrop-filter: blur(16px); border: 1px solid var(--glass-border); border-radius: var(--radius); }

    .header { padding: 20px 32px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--glass-border); background: rgba(9, 9, 14, 0.8); backdrop-filter: blur(20px); position: sticky; top: 0; z-index: 100; }
    .brand { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 12px; }
    .brand-text { background: var(--accent-gradient); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .api-url-input { padding: 10px 16px; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); border-radius: 8px; color: #fff; font-family: var(--mono); font-size: 13px; width: 400px; outline: none; transition: var(--transition); }
    .api-url-input:focus { border-color: var(--accent); }

    .layout { display: flex; flex: 1; }
    .sidebar { width: 280px; border-right: 1px solid var(--glass-border); background: rgba(9, 9, 14, 0.5); padding: 24px; display: flex; flex-direction: column; gap: 24px; overflow-y: auto; }
    .sidebar-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 12px; }
    
    .source-btn { width: 100%; padding: 10px 16px; text-align: left; background: transparent; border: 1px solid transparent; border-radius: 8px; color: var(--text-muted); cursor: pointer; font-family: var(--font); font-weight: 500; transition: var(--transition); margin-bottom: 4px; }
    .source-btn:hover { background: rgba(255,255,255,0.05); color: #fff; }
    .source-btn.active { background: rgba(139, 92, 246, 0.1); color: #fff; border-color: rgba(139, 92, 246, 0.3); }

    .ep-btn { width: 100%; padding: 8px 12px; text-align: left; background: transparent; border: none; border-radius: 6px; color: var(--text-muted); cursor: pointer; font-family: var(--mono); font-size: 13px; transition: var(--transition); margin-bottom: 2px; display: flex; align-items: center; gap: 8px; }
    .ep-btn:hover { background: rgba(255,255,255,0.05); color: #fff; }
    .ep-btn.active { background: rgba(139, 92, 246, 0.15); color: var(--accent-hover); }
    .method-badge { font-family: var(--font); font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; background: rgba(16, 185, 129, 0.15); color: var(--success); }

    .main { flex: 1; padding: 32px 48px; display: flex; flex-direction: column; gap: 24px; overflow-y: auto; }
    .ep-header h2 { font-size: 28px; font-weight: 600; margin-bottom: 8px; }
    .ep-path { font-family: var(--mono); font-size: 15px; color: var(--accent-hover); background: rgba(139, 92, 246, 0.1); padding: 8px 16px; border-radius: 8px; display: inline-block; margin-bottom: 12px; }
    .ep-desc { color: var(--text-muted); }

    .params-card { padding: 24px; }
    .params-card h3 { font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 16px; color: var(--text-muted); }
    .param-row { display: flex; align-items: center; gap: 16px; margin-bottom: 12px; }
    .param-row label { width: 80px; font-family: var(--mono); font-size: 13px; color: var(--text-muted); }
    .param-row input { flex: 1; padding: 10px 16px; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); border-radius: 8px; color: #fff; font-family: var(--mono); font-size: 14px; outline: none; transition: var(--transition); }
    .param-row input:focus { border-color: var(--accent); }
    
    .actions { display: flex; gap: 12px; margin-top: 24px; }
    .btn { padding: 12px 24px; border-radius: 8px; border: none; font-family: var(--font); font-weight: 600; font-size: 14px; cursor: pointer; transition: var(--transition); }
    .btn-primary { background: var(--accent-gradient); color: #fff; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4); }
    .btn-secondary { background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); color: #fff; }
    .btn-secondary:hover { background: rgba(255,255,255,0.1); }

    .response-card { display: none; overflow: hidden; }
    .response-card.active { display: block; animation: slideUp 0.3s ease; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    .resp-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; background: rgba(0,0,0,0.3); border-bottom: 1px solid var(--glass-border); font-family: var(--mono); font-size: 13px; }
    .status-ok { color: var(--success); }
    .status-err { color: var(--error); }
    .status-warn { color: var(--warning); }
    .resp-meta { color: var(--text-muted); display: flex; gap: 16px; }

    .resp-tabs { display: flex; background: rgba(0,0,0,0.2); border-bottom: 1px solid var(--glass-border); }
    .resp-tab { padding: 10px 24px; background: none; border: none; color: var(--text-muted); font-family: var(--font); font-size: 13px; font-weight: 500; cursor: pointer; border-bottom: 2px solid transparent; }
    .resp-tab.active { color: var(--accent-hover); border-bottom-color: var(--accent); }

    .resp-body { padding: 24px; max-height: 500px; overflow: auto; background: rgba(0,0,0,0.5); }
    .resp-pane { display: none; }
    .resp-pane.active { display: block; }
    pre { font-family: var(--mono); font-size: 13px; line-height: 1.5; color: #e2e8f0; white-space: pre-wrap; word-break: break-all; margin: 0; }

    .audio-card { display: none; padding: 24px; }
    .audio-card.active { display: block; }
    audio { width: 100%; height: 44px; outline: none; border-radius: 8px; }

    .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 1000; display: flex; flex-direction: column; gap: 8px; }
    .toast { padding: 12px 20px; border-radius: 8px; font-size: 14px; background: var(--bg-panel); backdrop-filter: blur(10px); border: 1px solid var(--glass-border); animation: slideIn 0.3s ease; }
    .toast.err { border-color: rgba(239, 68, 68, 0.5); color: #fca5a5; }
    .toast.ok { border-color: rgba(16, 185, 129, 0.5); color: #6ee7b7; }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  </style>
</head>
<body>

  <div class="header">
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="url(#grad1)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <defs><linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#8b5cf6" /><stop offset="100%" stop-color="#ec4899" /></linearGradient></defs>
        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line>
      </svg>
      <span class="brand-text">API Tester</span>
    </div>
    <input type="text" id="apiBase" class="api-url-input" value="https://LocalFind-OpenMusic-API.hf.space" spellcheck="false">
  </div>

  <div class="layout">
    <div class="sidebar">
      <div>
        <div class="sidebar-label">Source</div>
        <button class="source-btn" data-source="global">Global (System)</button>
        <button class="source-btn active" data-source="jiosaavn">JioSaavn</button>
        <button class="source-btn" data-source="youtube">YouTube Music</button>
      </div>
      <div>
        <div class="sidebar-label">Endpoints</div>
        <div id="endpointList"></div>
      </div>
    </div>

    <div class="main">
      <div class="ep-header">
        <h2 id="epTitle">Endpoint Title</h2>
        <div class="ep-path" id="epPath">/path</div>
        <div class="ep-desc" id="epDesc">Description</div>
      </div>

      <div class="params-card glass">
        <h3>Parameters</h3>
        <div id="paramInputs"></div>
        <div class="actions">
          <button class="btn btn-primary" id="sendBtn">Send Request</button>
          <button class="btn btn-secondary" id="clearBtn">Clear</button>
        </div>
      </div>

      <div class="audio-card glass" id="audioCard">
        <h3 style="margin-bottom: 16px; color: var(--text-muted); font-size: 12px; text-transform: uppercase; letter-spacing: 1px;">Audio Stream Proxy</h3>
        <audio id="audioPlayer" controls preload="none"></audio>
      </div>

      <div class="response-card glass" id="responseCard">
        <div class="resp-header">
          <span id="respStatus" style="font-weight: 700;">-</span>
          <div class="resp-meta">
            <span id="respTime">-</span>
            <span id="respSize">-</span>
          </div>
        </div>
        <div class="resp-tabs">
          <button class="resp-tab active" data-pane="formatted">Formatted JSON</button>
          <button class="resp-tab" data-pane="raw">Raw</button>
          <button class="resp-tab" data-pane="headers">Headers</button>
        </div>
        <div class="resp-body">
          <div class="resp-pane active" id="paneFormatted"><pre id="outFormatted">Send a request to view response</pre></div>
          <div class="resp-pane" id="paneRaw"><pre id="outRaw"></pre></div>
          <div class="resp-pane" id="paneHeaders"><pre id="outHeaders"></pre></div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script>
    const $ = s => document.querySelector(s);
    const $$ = s => document.querySelectorAll(s);

    let state = { source: 'jiosaavn', endpointId: null };

    const ENDPOINTS = {
      global: [
        { id: 'health', label: 'Health Check', path: '/health', desc: 'Server status & active sources', params: [], hasStream: false }
      ],
      jiosaavn: [
        { id: 'search', label: 'Search', path: '/jiosaavn/search?q={q}', desc: 'Search for songs, albums, and artists', params: [{ key: 'q', label: 'Query', placeholder: 'e.g. tere naal', req: true }], hasStream: false },
        { id: 'suggestions', label: 'Suggestions', path: '/jiosaavn/suggestions?q={q}', desc: 'Autocomplete search suggestions', params: [{ key: 'q', label: 'Query', placeholder: 'e.g. tere', req: true }], hasStream: false },
        { id: 'album', label: 'Album', path: '/jiosaavn/album/{id}', desc: 'Get album details & track list', params: [{ key: 'id', label: 'ID', placeholder: 'e.g. 70160165', req: true }], hasStream: false },
        { id: 'playlist', label: 'Playlist', path: '/jiosaavn/playlist/{id}', desc: 'Get playlist details & track list', params: [{ key: 'id', label: 'ID', placeholder: 'e.g. 1134543272', req: true }], hasStream: false },
        { id: 'charts', label: 'Charts', path: '/jiosaavn/charts', desc: 'Get trending charts', params: [], hasStream: false },
        { id: 'track', label: 'Track Stream URL', path: '/jiosaavn/track/{id}', desc: 'Get playback stream URL & metadata', params: [{ key: 'id', label: 'ID', placeholder: 'e.g. 0gKfBAgi', req: true }], hasStream: false },
        { id: 'play', label: 'Play Stream (Proxy)', path: '/jiosaavn/track/{id}/play', desc: 'Proxy audio stream directly through the server', params: [{ key: 'id', label: 'ID', placeholder: 'e.g. 0gKfBAgi', req: true }], hasStream: true }
      ],
      youtube: [
        { id: 'search', label: 'Search', path: '/youtube/search?q={q}', desc: 'Search for songs on YouTube Music', params: [{ key: 'q', label: 'Query', placeholder: 'e.g. tere naal', req: true }], hasStream: false },
        { id: 'suggestions', label: 'Suggestions', path: '/youtube/suggestions?q={q}', desc: 'Autocomplete search suggestions', params: [{ key: 'q', label: 'Query', placeholder: 'e.g. tere', req: true }], hasStream: false },
        { id: 'charts', label: 'Charts', path: '/youtube/charts', desc: 'Get charts (requires auth, returns empty)', params: [], hasStream: false },
        { id: 'track', label: 'Track Stream URL', path: '/youtube/track/{id}', desc: 'Get stream URL (Resolved via Smart Track Replacement)', params: [
            { key: 'id', label: 'ID', placeholder: 'e.g. dQw4w9WgXcQ', req: true },
            { key: 'title', label: 'Title (Hint)', placeholder: 'e.g. Never Gonna Give You Up', req: false },
            { key: 'artist', label: 'Artist (Hint)', placeholder: 'e.g. Rick Astley', req: false }
          ], hasStream: false },
        { id: 'play', label: 'Play Stream (Proxy)', path: '/youtube/track/{id}/play', desc: 'Proxy audio stream through the server', params: [
            { key: 'id', label: 'ID', placeholder: 'e.g. dQw4w9WgXcQ', req: true },
            { key: 'title', label: 'Title (Hint)', placeholder: 'e.g. Never Gonna Give You Up', req: false },
            { key: 'artist', label: 'Artist (Hint)', placeholder: 'e.g. Rick Astley', req: false }
          ], hasStream: true },
        { id: 'album', label: 'Album (501)', path: '/youtube/album/{id}', desc: 'Get album (Returns 501 Not Implemented)', params: [{ key: 'id', label: 'ID', placeholder: 'e.g. MPREb_DHWbS7Con8q', req: true }], hasStream: false },
        { id: 'playlist', label: 'Playlist (501)', path: '/youtube/playlist/{id}', desc: 'Get playlist (Returns 501 Not Implemented)', params: [{ key: 'id', label: 'ID', placeholder: 'e.g. PL...', req: true }], hasStream: false }
      ]
    };

    function showToast(msg, type='info') {
      const t = document.createElement('div');
      t.className = `toast ${type}`;
      t.textContent = msg;
      $('#toastContainer').appendChild(t);
      setTimeout(() => t.remove(), 4000);
    }

    function renderSidebar() {
      const list = $('#endpointList');
      list.innerHTML = '';
      ENDPOINTS[state.source].forEach(ep => {
        const btn = document.createElement('button');
        btn.className = `ep-btn ${state.endpointId === ep.id ? 'active' : ''}`;
        btn.innerHTML = `<span class="method-badge">GET</span> ${ep.label}`;
        btn.onclick = () => selectEndpoint(ep.id);
        list.appendChild(btn);
      });
      if (!state.endpointId || !ENDPOINTS[state.source].find(e => e.id === state.endpointId)) {
        selectEndpoint(ENDPOINTS[state.source][0].id);
      }
    }

    function selectEndpoint(id) {
      state.endpointId = id;
      $$('.ep-btn').forEach(b => b.classList.remove('active'));
      const activeBtn = Array.from($$('.ep-btn')).find(b => b.textContent.includes(ENDPOINTS[state.source].find(e=>e.id===id).label));
      if(activeBtn) activeBtn.classList.add('active');

      const ep = ENDPOINTS[state.source].find(e => e.id === id);
      $('#epTitle').textContent = ep.label;
      $('#epPath').textContent = ep.path;
      $('#epDesc').textContent = ep.desc;

      const pContainer = $('#paramInputs');
      pContainer.innerHTML = '';
      if (ep.params.length === 0) {
        pContainer.innerHTML = '<div style="color: var(--text-muted); font-size: 13px; font-family: var(--mono);">No parameters required</div>';
      } else {
        ep.params.forEach(p => {
          pContainer.innerHTML += `
            <div class="param-row">
              <label>${p.key}${p.req ? '*' : ''}</label>
              <input type="text" id="param-${p.key}" placeholder="${p.placeholder}">
            </div>
          `;
        });
      }

      $('#responseCard').classList.remove('active');
      $('#audioCard').classList.remove('active');
      $('#audioPlayer').pause();
    }

    $$('.source-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        $$('.source-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.source = btn.dataset.source;
        renderSidebar();
      });
    });

    $$('.resp-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        $$('.resp-tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        $$('.resp-pane').forEach(p => p.classList.remove('active'));
        $(`#pane${btn.dataset.pane.charAt(0).toUpperCase() + btn.dataset.pane.slice(1)}`).classList.add('active');
      });
    });

    $('#clearBtn').addEventListener('click', () => {
      $$('.param-row input').forEach(i => i.value = '');
      $('#responseCard').classList.remove('active');
      $('#audioCard').classList.remove('active');
      $('#audioPlayer').pause();
    });

    $('#sendBtn').addEventListener('click', async () => {
      const ep = ENDPOINTS[state.source].find(e => e.id === state.endpointId);
      const base = $('#apiBase').value.trim().replace(/\/+$/, '');
      let path = ep.path;
      const queryParams = new URLSearchParams();

      for (const p of ep.params) {
        const val = $(`#param-${p.key}`).value.trim();
        if (p.req && !val) return showToast(`Parameter "${p.key}" is required`, 'err');
        
        if (path.includes(`{${p.key}}`)) {
          path = path.replace(`{${p.key}}`, encodeURIComponent(val));
        } else if (val) {
          queryParams.append(p.key, val);
        }
      }

      const qString = queryParams.toString();
      const finalUrl = `${base}${path.split('?')[0]}${path.includes('?') ? '?' + path.split('?')[1].replace(/\{.*?\}/g, '') : ''}${qString ? (path.includes('?') ? '&' : '?') + qString : ''}`.replace(/[?&]$/, '');

      $('#sendBtn').textContent = 'Sending...';
      $('#sendBtn').disabled = true;
      $('#responseCard').classList.remove('active');
      $('#audioCard').classList.remove('active');
      $('#audioPlayer').pause();

      const start = performance.now();

      if (ep.hasStream) {
        $('#audioPlayer').src = finalUrl;
        $('#audioCard').classList.add('active');
        showToast('Stream proxy ready. Press play below.', 'ok');
        $('#sendBtn').textContent = 'Send Request';
        $('#sendBtn').disabled = false;
        return;
      }

      try {
        const res = await fetch(finalUrl);
        const dur = ((performance.now() - start) / 1000).toFixed(2);
        
        $('#respStatus').textContent = `${res.status} ${res.statusText}`;
        $('#respStatus').className = res.ok ? 'status-ok' : res.status >= 400 ? 'status-err' : 'status-warn';
        $('#respTime').textContent = `${dur}s`;

        const data = await res.json().catch(() => null);
        const rawText = data ? JSON.stringify(data, null, 2) : await res.text();
        const size = new Blob([rawText]).size;
        $('#respSize').textContent = size > 1024 ? `${(size / 1024).toFixed(1)} KB` : `${size} B`;

        $('#outFormatted').textContent = rawText;
        $('#outRaw').textContent = rawText;

        const headers = {};
        for (let [k, v] of res.headers.entries()) headers[k] = v;
        $('#outHeaders').textContent = JSON.stringify(headers, null, 2);

        $('#responseCard').classList.add('active');
        if (res.ok) showToast('Request successful', 'ok');
        else showToast(`Error ${res.status}: ${data?.message || 'Failed'}`, 'err');

      } catch (err) {
        showToast('Network error or CORS issue', 'err');
        $('#respStatus').textContent = 'Error';
        $('#respStatus').className = 'status-err';
        $('#outFormatted').textContent = err.message;
        $('#outRaw').textContent = err.stack;
        $('#responseCard').classList.add('active');
      }

      $('#sendBtn').textContent = 'Send Request';
      $('#sendBtn').disabled = false;
    });

    // Init
    renderSidebar();

  </script>
</body>
</html>
