<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenMusic Admin Test</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #09090e;
      --bg-panel: rgba(20, 20, 28, 0.6);
      --glass-border: rgba(255, 255, 255, 0.08);
      --accent: #8b5cf6;
      --accent-gradient: linear-gradient(135deg, #8b5cf6, #ec4899);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --radius: 16px;
      --font: 'Outfit', sans-serif;
      --transition: all 0.3s ease;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font);
      background: var(--bg-dark);
      background-image: radial-gradient(circle at 15% 50%, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 85% 30%, rgba(236, 72, 153, 0.15) 0%, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
    }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

    .glass {
      background: var(--bg-panel);
      backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
    }

    .sidebar {
      width: 300px;
      height: 100vh;
      position: fixed;
      left: 0; top: 0;
      padding: 24px;
      display: flex; flex-direction: column; gap: 24px;
      border-right: 1px solid var(--glass-border);
      background: rgba(9, 9, 14, 0.8);
      backdrop-filter: blur(20px);
      z-index: 100;
    }
    .brand { font-size: 24px; font-weight: 700; background: var(--accent-gradient); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    
    .input-group { display: flex; flex-direction: column; gap: 8px; }
    .input-group label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
    .api-input {
      padding: 12px;
      background: rgba(0,0,0,0.2);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      color: #fff;
      font-family: monospace;
      font-size: 13px;
      outline: none;
      transition: var(--transition);
    }
    .api-input:focus { border-color: var(--accent); }

    .source-btn {
      padding: 12px; border-radius: 10px; border: 1px solid var(--glass-border);
      background: rgba(0,0,0,0.2); color: var(--text-muted); cursor: pointer;
      font-family: var(--font); font-weight: 500; transition: var(--transition);
    }
    .source-btn.active { border-color: var(--accent); color: #fff; background: rgba(139, 92, 246, 0.1); }

    .main-content { margin-left: 300px; padding: 32px 48px; width: calc(100% - 300px); min-height: 100vh; padding-bottom: 120px; }
    .search-container { position: relative; max-width: 600px; margin-bottom: 32px; display: flex; gap: 12px; }
    .search-input { flex: 1; padding: 16px 24px; font-size: 16px; color: #fff; background: var(--bg-panel); border: 1px solid var(--glass-border); border-radius: 100px; outline: none; transition: var(--transition); }
    .search-input:focus { border-color: var(--accent); }
    .search-btn { padding: 0 32px; border-radius: 100px; border: none; background: var(--accent-gradient); color: #fff; font-weight: 600; cursor: pointer; transition: var(--transition); }
    .search-btn:hover { transform: scale(1.05); }

    .suggestions { position: absolute; top: calc(100% + 8px); left: 0; right: 140px; z-index: 50; display: none; padding: 8px; }
    .suggestions.active { display: block; }
    .suggestion-item { padding: 12px 16px; border-radius: 8px; cursor: pointer; color: var(--text-muted); transition: var(--transition); }
    .suggestion-item:hover { background: rgba(255,255,255,0.05); color: #fff; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 24px; }
    .card { padding: 16px; cursor: pointer; transition: var(--transition); }
    .card:hover { transform: translateY(-8px); border-color: rgba(255,255,255,0.2); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .card-img-wrapper { position: relative; width: 100%; aspect-ratio: 1; border-radius: 12px; overflow: hidden; margin-bottom: 16px; }
    .card-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
    .card:hover .card-img { transform: scale(1.08); }
    .play-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; opacity: 0; transition: var(--transition); }
    .card:hover .play-overlay { opacity: 1; }
    .play-icon { width: 48px; height: 48px; border-radius: 50%; background: var(--accent-gradient); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 20px; transform: translateY(10px); transition: var(--transition); }
    .card:hover .play-icon { transform: translateY(0); }
    .card-title { font-weight: 600; font-size: 15px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-subtitle { color: var(--text-muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .player { position: fixed; bottom: 0; left: 0; right: 0; height: 90px; background: rgba(10, 10, 15, 0.85); backdrop-filter: blur(20px); border-top: 1px solid var(--glass-border); display: flex; align-items: center; padding: 0 32px; z-index: 200; transform: translateY(100%); transition: transform 0.4s ease; }
    .player.active { transform: translateY(0); }
    .np-info { display: flex; align-items: center; gap: 16px; width: 300px; }
    .np-img { width: 56px; height: 56px; border-radius: 8px; object-fit: cover; }
    .np-text { display: flex; flex-direction: column; gap: 4px; overflow: hidden; }
    .np-title { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .np-artist { color: var(--text-muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .audio-controls { flex: 1; display: flex; justify-content: center; }
    audio { width: 100%; max-width: 600px; height: 40px; outline: none; }
    .close-btn { background: none; border: none; color: var(--text-muted); font-size: 24px; cursor: pointer; position: absolute; right: 32px; }
    .close-btn:hover { color: #fff; }

    .toast-container { position: fixed; bottom: 100px; right: 24px; z-index: 300; display: flex; flex-direction: column; gap: 8px; }
    .toast { padding: 12px 20px; border-radius: 12px; font-size: 14px; background: var(--bg-panel); backdrop-filter: blur(10px); border: 1px solid var(--glass-border); animation: slideIn 0.3s ease; }
    .toast.err { border-color: rgba(248, 113, 113, 0.5); color: #fca5a5; }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    .loading { text-align: center; padding: 40px; color: var(--text-muted); grid-column: 1/-1; }
    .spinner { width: 32px; height: 32px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="brand">OpenMusic Admin</div>
    
    <div class="input-group">
      <label>API Base URL</label>
      <input type="text" id="apiBase" class="api-input" value="https://LocalFind-OpenMusic-API.hf.space" spellcheck="false">
    </div>

    <div class="input-group" style="margin-top: 16px;">
      <label>Music Source</label>
      <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 8px;">
        <button class="source-btn active" data-source="jiosaavn">JioSaavn</button>
        <button class="source-btn" data-source="youtube">YouTube Music</button>
      </div>
    </div>
  </aside>

  <main class="main-content">
    <div class="search-container">
      <input type="text" id="searchInput" class="search-input" placeholder="Search for songs, artists, albums..." autocomplete="off">
      <button id="searchBtn" class="search-btn">Search</button>
      <div id="suggestions" class="suggestions glass"></div>
    </div>

    <h2 id="resultsHeader" style="font-size: 20px; margin-bottom: 24px; font-weight: 500; display: none;">
      Results for <strong id="resultsQuery" style="color: #fff;"></strong> 
      <span id="resultsCount" style="color: var(--text-muted); font-size: 14px; margin-left: 12px;"></span>
    </h2>

    <div id="resultsContainer" class="grid">
      <div class="loading" style="display: none;">
        <div class="spinner"></div>
        <div>Searching...</div>
      </div>
    </div>
  </main>

  <div class="player" id="player">
    <div class="np-info">
      <img src="" alt="" class="np-img" id="npImg" style="display: none;">
      <div class="np-text">
        <div class="np-title" id="npTitle">No track selected</div>
        <div class="np-artist" id="npArtist"></div>
      </div>
    </div>
    <div class="audio-controls">
      <audio id="audio" controls preload="auto"></audio>
    </div>
    <button class="close-btn" id="closePlayer">&times;</button>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script>
    const $ = s => document.querySelector(s);
    const $$ = s => document.querySelectorAll(s);

    let state = { source: 'jiosaavn', timer: null };

    const esc = str => (str || '').replace(/[&<>'"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;' }[c]));
    const fmtDur = s => s ? `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}` : '--:--';

    function getBase() { return $('#apiBase').value.trim().replace(/\/+$/, ''); }

    function showToast(msg, type='info') {
      const t = document.createElement('div');
      t.className = `toast ${type}`;
      t.textContent = msg;
      $('#toastContainer').appendChild(t);
      setTimeout(() => t.remove(), 4000);
    }

    $$('.source-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        $$('.source-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.source = btn.dataset.source;
        $('#searchInput').placeholder = `Search ${state.source === 'jiosaavn' ? 'JioSaavn' : 'YouTube Music'}...`;
        $('#resultsContainer').innerHTML = '';
        $('#resultsHeader').style.display = 'none';
      });
    });

    $('#searchInput').addEventListener('input', e => {
      clearTimeout(state.timer);
      const q = e.target.value.trim();
      if (q.length < 2) return $('#suggestions').classList.remove('active');
      state.timer = setTimeout(async () => {
        try {
          const res = await fetch(`${getBase()}/${state.source}/suggestions?q=${encodeURIComponent(q)}`);
          if (!res.ok) return;
          const data = await res.json();
          if (data.suggestions?.length) {
            $('#suggestions').innerHTML = data.suggestions.map(s => `<div class="suggestion-item">${esc(s)}</div>`).join('');
            $('#suggestions').classList.add('active');
            $$('.suggestion-item').forEach(item => {
              item.addEventListener('click', () => {
                $('#searchInput').value = item.textContent;
                $('#suggestions').classList.remove('active');
                doSearch();
              });
            });
          }
        } catch(err) {}
      }, 300);
    });

    document.addEventListener('click', e => { if (!e.target.closest('.search-container')) $('#suggestions').classList.remove('active'); });
    $('#searchBtn').addEventListener('click', doSearch);
    $('#searchInput').addEventListener('keydown', e => e.key === 'Enter' && doSearch());

    async function doSearch() {
      const q = $('#searchInput').value.trim();
      if (!q) return;
      $('#suggestions').classList.remove('active');
      $('#resultsContainer').innerHTML = '<div class="loading"><div class="spinner"></div><div>Searching...</div></div>';
      $('#resultsHeader').style.display = 'none';

      try {
        const res = await fetch(`${getBase()}/${state.source}/search?q=${encodeURIComponent(q)}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || `Error ${res.status}`);
        
        $('#resultsHeader').style.display = 'block';
        $('#resultsQuery').textContent = data.query;
        $('#resultsCount').textContent = `${data.results?.length || 0} results`;

        if (!data.results?.length) {
          $('#resultsContainer').innerHTML = '<div class="loading">No results found</div>';
          return;
        }

        $('#resultsContainer').innerHTML = data.results.map(t => `
          <div class="card glass" onclick="playTrack('${esc(t.id)}', '${esc(t.title)}', '${esc(t.artist)}', '${esc(t.thumbnail)}')">
            <div class="card-img-wrapper">
              <img src="${t.thumbnail || ''}" class="card-img" onerror="this.style.display='none'">
              <div class="play-overlay"><div class="play-icon">&#9654;</div></div>
            </div>
            <div class="card-title">${esc(t.title)}</div>
            <div class="card-subtitle">${esc(t.artist)} &bull; ${fmtDur(t.duration_seconds)}</div>
          </div>
        `).join('');
      } catch (err) {
        $('#resultsContainer').innerHTML = '';
        showToast(err.message, 'err');
      }
    }

    async function playTrack(id, title, artist, thumb) {
      $('#npTitle').textContent = title;
      $('#npArtist').textContent = artist;
      $('#npImg').src = thumb;
      $('#npImg').style.display = 'block';
      $('#player').classList.add('active');
      
      const audio = $('#audio');
      audio.pause();
      const queryParams = new URLSearchParams({ title, artist }).toString();
      audio.src = `${getBase()}/${state.source}/track/${encodeURIComponent(id)}/play?${queryParams}`;
      audio.play().catch(err => showToast('Playback failed', 'err'));
    }

    $('#closePlayer').addEventListener('click', () => {
      $('#audio').pause();
      $('#player').classList.remove('active');
    });

    $('#audio').addEventListener('error', () => {
      showToast('Audio playback error', 'err');
      $('#player').classList.remove('active');
    });
  </script>
</body>
</html>
